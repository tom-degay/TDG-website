<style>

  @font-face {
    font-family: "Fakt Blond SemiBold";
    src: url("FaktProSemiBold.woff2") format("woff2"),
         url("FaktProSemiBold.woff") format("woff");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Fakt Blond";
    src: url("FaktProBlond.woff2") format("woff2"),
         url("FaktProBlond.woff") format("woff");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }

  body {
    font-family: "Fakt Blond", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-width: 250px;
  }

  main {
    max-width: 592px;
    margin: 0 auto;
    padding: clamp(24px, 6vw, 72px) clamp(24px, 5vw, 56px) clamp(96px, 12vw, 140px);
  }

  .display {
    font-family: "Fakt Blond SemiBold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
  }

  a {
    color: #fff;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    padding-bottom: 1px;
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }

  a:hover,
  a:focus-visible {
    border-color: rgba(255, 255, 255, 0.9);
  }

  a:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.6);
    outline-offset: 4px;
    border-radius: 1px;
  }

  a[target="_blank"] {
    position: relative;
  }

  a[target="_blank"]::after {
    content: "→";
    position: absolute;
    right: -1.1em;
    top: 50%;
    transform: translate(-4px, -50%);
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
    pointer-events: none;
    will-change: transform, opacity;
  }

  a[target="_blank"]:hover::after,
  a[target="_blank"]:focus-visible::after {
    opacity: 1;
    transform: translate(0, -50%);
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }

  .back-link:hover,
  .back-link:focus-visible {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.9);
  }

  .eyebrow {
    display: block;
    font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    color: #00d8aa;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    word-spacing: -3px;
    text-transform: uppercase;
    margin: 32px 0 28px;
  }

  .contact-header {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 10px 24px;
    margin-bottom: clamp(32px, 5vw, 48px);
  }

  p.links {
    margin: 0;
    font-size: clamp(15px, 1.7vw, 17px);
    white-space: nowrap;
  }

  p.links a + a {
    margin-left: 28px;
  }

  .lede {
    color: #fff;
    font-size: clamp(24px, 3.6vw, 32px);
    line-height: 1.35;
    margin: 0 0 clamp(36px, 5.5vw, 52px);
    max-width: 26ch;
  }

  form {
    max-width: 480px;
  }

  .field {
    margin-bottom: 28px;
  }

  .field label {
    font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    display: block;
    color: rgba(255, 255, 255, 0.45);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    word-spacing: -3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    padding: 8px 0 10px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .field textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.4;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }

  .field input:focus,
  .field textarea:focus {
    border-bottom-color: rgba(255, 255, 255, 0.9);
  }

  button[type="submit"] {
    background-color: transparent;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    padding: 12px 26px;
    color: #fff;
    font-family: "Fakt Blond SemiBold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  button[type="submit"]:hover,
  button[type="submit"]:focus-visible {
    background-color: #1a1a1a;
    border-color: rgba(255, 255, 255, 0.6);
  }

  button[type="submit"]:disabled {
    cursor: default;
    opacity: 0.6;
  }

  .form-status {
    margin-top: 18px;
    font-size: 17px;
    color: rgba(255, 255, 255, 0.68);
  }

  /* -- site nav -- */

  .site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
  }

  /* Frosted bar background lives on a pseudo-element so .site-nav itself is
     not a backdrop-filter root — otherwise the open mobile menu panel (a
     descendant that has its own backdrop-filter) can't blur the page. */
  .site-nav::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.86);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .site-nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px clamp(24px, 5vw, 56px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
    min-height: 56px;
  }

  @media (min-width: 1100px) {
    .site-nav-inner {
      max-width: 1320px;
    }
  }

  .site-nav-brand {
    font-size: 24px;
    color: #fff;
    border-bottom: none;
  }

  .site-nav-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 28px;
  }

  .site-nav-links a {
    font-family: "Fakt Blond SemiBold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.65);
    border-bottom: none;
  }

  .site-nav-links a:hover,
  .site-nav-links a:focus-visible {
    color: #fff;
  }

  .site-nav-links a.is-current {
    color: #00d8aa;
  }

  .nav-item {
    position: relative;
  }

  .nav-dropdown {
    position: absolute;
    top: 100%;
    left: 50%;
    padding-top: 14px;
    min-width: 320px;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -6px);
    transition: opacity 0.15s ease 0.12s, transform 0.15s ease 0.12s, visibility 0.15s ease 0.12s;
    z-index: 60;
  }

  .nav-item:hover .nav-dropdown,
  .nav-item:focus-within .nav-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
    transition-delay: 0s;
  }

  .nav-dropdown-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    background: #1a1a1a;
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  }

  .nav-dropdown-card {
    display: block;
    padding: 14px 16px 12px;
    border-radius: 8px;
    background-color: transparent;
    transition: background-color 0.2s ease;
  }

  .nav-dropdown-card:hover,
  .nav-dropdown-card:focus-visible {
    background-color: rgba(255, 255, 255, 0.08);
  }

  .nav-dropdown-card-kicker {
    display: block;
    font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    color: #00d8aa;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    word-spacing: -3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .nav-dropdown-card-title {
    display: block;
    font-family: "Fakt Blond SemiBold", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 600;
    color: #fff;
    font-size: 15px;
    line-height: 1.3;
  }

  .nav-dropdown-card-subtitle {
    display: block;
    color: rgba(255, 255, 255, 0.62);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.45;
    margin-top: 6px;
  }

  .nav-dropdown-card.is-current .nav-dropdown-card-title {
    color: #00d8aa;
  }

  /* -- mobile: collapse the nav links behind a hamburger (<= 640px) -- */

  .nav-toggle {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 44px;
    height: 44px;
    margin: -10px -12px -10px 0;
    padding: 0;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
  }

  .nav-toggle-bar {
    display: block;
    width: 22px;
    height: 2px;
    background: currentColor;
    transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.2s ease;
  }

  .nav-toggle-bar:nth-child(2) {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .site-nav.is-open .nav-toggle-bar:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .site-nav.is-open .nav-toggle-bar:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }

  .site-nav.is-open .nav-toggle-bar:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  @media (max-width: 640px) {
    .nav-toggle {
      display: flex;
    }

    .site-nav-inner {
      flex-wrap: nowrap;
    }

    .site-nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      max-height: 72vh;
      overflow-y: auto;
      padding: 6px clamp(24px, 5vw, 56px) 18px;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .site-nav.is-open .site-nav-links {
      display: flex;
    }

    .site-nav-links > a,
    .nav-item > a {
      display: block;
      padding: 14px 0;
      font-size: 20px;
    }

    .site-nav-links > a + a,
    .nav-item {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-dropdown {
      position: static;
      min-width: 0;
      padding: 0 0 10px;
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: none;
    }

    /* the desktop open-state rule is more specific and would otherwise
       still slide the panel -50% when the item is hovered/focused here */
    .nav-item:hover .nav-dropdown,
    .nav-item:focus-within .nav-dropdown {
      transform: none;
    }

    .nav-dropdown-panel {
      gap: 2px;
      padding: 0;
      background: none;
      box-shadow: none;
    }

    .nav-dropdown-card {
      padding: 9px 0 9px 16px;
    }

    .nav-dropdown-card-subtitle {
      display: none;
    }
  }

</style>
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-brand display" href="/">Tom de Gay</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="site-nav-links" id="site-nav-links">
        <a href="/about">About</a>
        <a href="/approach">Approach</a>
        <div class="nav-item">
          <a href="/case-studies">Case Studies</a>
          <div class="nav-dropdown">
            <div class="nav-dropdown-panel">
              <a class="nav-dropdown-card" href="/case-studies/mapping-inconsistent-schemas">
                <span class="nav-dropdown-card-kicker">Column mapping</span>
                <span class="nav-dropdown-card-title">Mapping inconsistent schemas<br>at scale</span>
              </a>
              <a class="nav-dropdown-card" href="/case-studies/connecting-organisations">
                <span class="nav-dropdown-card-kicker">Feeds</span>
                <span class="nav-dropdown-card-title">Connecting organisations<br>through data</span>
              </a>
              <a class="nav-dropdown-card" href="/case-studies/validation-and-correction">
                <span class="nav-dropdown-card-kicker">Validation</span>
                <span class="nav-dropdown-card-title">Closing the loop on<br>data quality</span>
              </a>
            </div>
          </div>
        </div>
        <a href="/contact" class="is-current">Contact</a>
      </div>
    </div>
  </nav>
  <main>
    <div class="contact-header">
      <p class="links">
        <a href="https://www.linkedin.com/in/tom-dg/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="TomdeGayCV.pdf" download="Tom de Gay - CV.pdf" target="_blank" rel="noopener noreferrer">Download CV</a>
      </p>
    </div>

    <span class="eyebrow">Contact</span>

    <p class="lede display">Say hello. I&rsquo;m always happy to hear from people.</p>

    <form id="contact-form">
      <input type="hidden" name="access_key" value="a394dc7c-b791-40e6-9971-a34a75f44939">
      <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" autocomplete="off">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Say hello" required></textarea>
      </div>
      <button type="submit">Send</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite" hidden></p>
    </form>
  </main>
  <script>
    (function () {
      var form = document.getElementById("contact-form");
      var status = document.getElementById("form-status");
      var button = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        var formData = new FormData(form);
        var payload = Object.fromEntries(formData);

        button.disabled = true;
        button.textContent = "Sending…";
        status.hidden = true;

        fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: JSON.stringify(payload)
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data.success) {
              form.reset();
              status.textContent = "Thanks. I'll get back to you soon.";
            } else {
              status.textContent = "Something went wrong. Please email me directly instead.";
            }
            status.hidden = false;
          })
          .catch(function () {
            status.textContent = "Something went wrong. Please email me directly instead.";
            status.hidden = false;
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = "Send";
          });
      });
    })();
  </script>
  <script>
    (function () {
      var nav = document.querySelector('.site-nav');
      if (!nav) return;
      var toggle = nav.querySelector('.nav-toggle');
      var links = nav.querySelector('.site-nav-links');
      if (!toggle || !links) return;
      function setOpen(open) {
        nav.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      toggle.addEventListener('click', function () {
        setOpen(!nav.classList.contains('is-open'));
      });
      links.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
      document.addEventListener('click', function (e) {
        if (nav.classList.contains('is-open') && !nav.contains(e.target)) setOpen(false);
      });
      window.addEventListener('resize', function () {
        if (window.innerWidth > 640) setOpen(false);
      });
    })();
  </script>
  <script data-goatcounter="https://tomdegay.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
